
{%- from 'partials/_macros.html' import media %}

<header class="ft-header sticky-top">

    <nav class="navbar navbar-expand-lg navbar-dark"
         aria-label="Navegación principal">

        <div class="container">

            <!-- LOGO Y NOMBRE DE LA MARCA -->
            <a class="navbar-brand d-flex align-items-center gap-2"
               href="{{ url_for('index') }}">

                <img
                    class="logo"
                    src="{{ url_for('static', filename='img/logo.png') }}"
                    alt="Logo de Fritos Tech"
                >

                <span class="lh-1">
                    <span class="marca">FRITOS TECH</span>
                    <span class="lema font-script d-block">
                        El sabor local, conectado.
                    </span>
                </span>

            </a>

            <!-- BOTÓN DEL MENÚ PARA MÓVILES -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- CONTENIDO DEL MENÚ -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <!-- ENLACES DE NAVEGACIÓN -->
                <ul class="navbar-nav mx-lg-auto gap-lg-4">

                    <li class="nav-item">
                        <a
                            class="nav-link {{ 'active' if request.endpoint == 'index' }}"
                            href="{{ url_for('index') }}"
                        >
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link {{ 'active' if request.endpoint == 'explorar' }}"
                            href="{{ url_for('explorar') }}"
                        >
                            Explorar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('index') }}#como-funciona"
                        >
                            Cómo funciona
                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('proximamente', pagina='vender') }}"
                        >
                            Vender
                        </a>
                    </li>

                   <li class="nav-item">
                        <a
                            class="nav-link"
                            href="mailto:hola@fritostech.co"
                        >
                            Contacto
                        </a>
                    </li>

                </ul>

                <!-- BOTONES Y ACCIONES -->
                <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">

                    <!-- BUSCADOR -->
                    <a
                        class="btn-icono"
                        href="{{ url_for('explorar') }}"
                        aria-label="Buscar fritos"
                    >
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </a>

                    <!-- CARRITO DE COMPRAS -->
                    <button
                        class="btn-icono position-relative"
                        type="button"
                        id="btn-carrito"
                        aria-label="Carrito de compras"
                    >
                        <i class="bi bi-cart3" aria-hidden="true"></i>

                        <span
                            id="cart-count"
                            class="cart-count"
                            hidden
                        >0</span>
                    </button>

                    <!-- INICIAR SESIÓN -->
                    <a
                        class="btn btn-fritos rounded-pill"
                        href="{{ url_for('proximamente', pagina='iniciar-sesion') }}"
                    >
                        Iniciar sesión
                    </a>

                  
                    <!-- <a
                          class="btn btn-fritos rounded-pill"
                        href="{{ url_for('proximamente', pagina='registro') }}"
                    >
                      
                    </a> -->

                </div>

            </div>

        </div>

    </nav>

</header>
